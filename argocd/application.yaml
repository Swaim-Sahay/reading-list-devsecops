apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: readinglist
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Swaim-Sahay/reading-list-devsecops.git
    targetRevision: main
    path: helm/readinglist
  destination:
    server: https://kubernetes.default.svc
    namespace: readinglist
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
