services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-readinglist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-readinglist}
      POSTGRES_DB: ${POSTGRES_DB:-readinglist}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-readinglist}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-readinglist}:${POSTGRES_PASSWORD:-readinglist}@db:5432/${POSTGRES_DB:-readinglist}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:8080"

volumes:
  pgdata:
